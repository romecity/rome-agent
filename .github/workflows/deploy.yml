name: Deploy Rome Agent

on:
  push:
    branches:
      - main   # deploys to prod
      - dev    # deploys to dev

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set environment
        id: set-env
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_OUTPUT
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Install CDK dependencies
        working-directory: infrastructure
        run: npm ci

      - name: Run unit tests
        working-directory: backend
        run: |
          pip install -r tests/requirements-test.txt
          PYTHONPATH=. pytest tests/test_query_handler.py -v -m "not integration and not load"

      - name: CDK synth (validate)
        working-directory: infrastructure
        run: npx cdk synth --context env=${{ steps.set-env.outputs.DEPLOY_ENV }}

      - name: CDK deploy
        working-directory: infrastructure
        run: |
          npx cdk deploy --all \
            --context env=${{ steps.set-env.outputs.DEPLOY_ENV }} \
            --require-approval never

      - name: Smoke test
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name RomeAgentAPIStack-${{ steps.set-env.outputs.DEPLOY_ENV }} \
            --query 'Stacks[0].Outputs[?OutputKey==`APIEndpoint`].OutputValue' \
            --output text)
          curl -f "${API_URL}health" || exit 1
          echo "Smoke test passed — Rome Agent is healthy"

      - name: Notify success
        if: success()
        run: echo "✅ Rome Agent deployed to ${{ steps.set-env.outputs.DEPLOY_ENV }}"

      - name: Notify failure
        if: failure()
        run: echo "❌ Rome Agent deployment failed"
