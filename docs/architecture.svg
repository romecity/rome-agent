<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Inter, -apple-system, system-ui, sans-serif">
  <!-- Background -->
  <rect width="900" height="520" fill="#0a0a0a" rx="12"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#f5f5f7" font-size="16" font-weight="600">Rome AI Agent — Architecture</text>

  <!-- User -->
  <rect x="30" y="200" width="100" height="60" rx="10" fill="#1c1c1e" stroke="#3a3a3c" stroke-width="1"/>
  <text x="80" y="226" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">User</text>
  <text x="80" y="244" text-anchor="middle" fill="#8e8e93" font-size="9">Browser</text>

  <!-- CloudFront / React -->
  <rect x="180" y="200" width="120" height="60" rx="10" fill="#1c1c1e" stroke="#6366f1" stroke-width="1.5"/>
  <text x="240" y="222" text-anchor="middle" fill="#a5b4fc" font-size="9">React + Vite</text>
  <text x="240" y="238" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">Frontend</text>
  <text x="240" y="254" text-anchor="middle" fill="#8e8e93" font-size="9">S3 + CloudFront</text>

  <!-- API Gateway -->
  <rect x="350" y="200" width="120" height="60" rx="10" fill="#1c1c1e" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="410" y="222" text-anchor="middle" fill="#fcd34d" font-size="9">REST API</text>
  <text x="410" y="238" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">API Gateway</text>
  <text x="410" y="254" text-anchor="middle" fill="#8e8e93" font-size="9">Rate Limiting + CORS</text>

  <!-- Lambda -->
  <rect x="520" y="200" width="120" height="60" rx="10" fill="#1c1c1e" stroke="#f97316" stroke-width="1.5"/>
  <text x="580" y="222" text-anchor="middle" fill="#fdba74" font-size="9">Python 3.13</text>
  <text x="580" y="238" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">Query Handler</text>
  <text x="580" y="254" text-anchor="middle" fill="#8e8e93" font-size="9">Lambda (512MB)</text>

  <!-- Bedrock KB -->
  <rect x="700" y="120" width="140" height="60" rx="10" fill="#1c1c1e" stroke="#10b981" stroke-width="1.5"/>
  <text x="770" y="142" text-anchor="middle" fill="#6ee7b7" font-size="9">Vector Search</text>
  <text x="770" y="158" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">Bedrock KB</text>
  <text x="770" y="174" text-anchor="middle" fill="#8e8e93" font-size="9">Titan Embeddings v2</text>

  <!-- Bedrock LLM -->
  <rect x="700" y="200" width="140" height="60" rx="10" fill="#1c1c1e" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="770" y="222" text-anchor="middle" fill="#c4b5fd" font-size="9">Generation</text>
  <text x="770" y="238" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">Claude Sonnet 4.6</text>
  <text x="770" y="254" text-anchor="middle" fill="#8e8e93" font-size="9">Amazon Bedrock</text>

  <!-- DynamoDB -->
  <rect x="700" y="280" width="140" height="60" rx="10" fill="#1c1c1e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="770" y="302" text-anchor="middle" fill="#93c5fd" font-size="9">Analytics</text>
  <text x="770" y="318" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">DynamoDB</text>
  <text x="770" y="334" text-anchor="middle" fill="#8e8e93" font-size="9">Pay-per-request + TTL</text>

  <!-- S3 Knowledge Base -->
  <rect x="700" y="360" width="140" height="60" rx="10" fill="#1c1c1e" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="770" y="382" text-anchor="middle" fill="#67e8f9" font-size="9">10 Documents</text>
  <text x="770" y="398" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">S3 Bucket</text>
  <text x="770" y="414" text-anchor="middle" fill="#8e8e93" font-size="9">Knowledge Base Source</text>

  <!-- CloudWatch -->
  <rect x="460" y="380" width="130" height="60" rx="10" fill="#1c1c1e" stroke="#ec4899" stroke-width="1.5"/>
  <text x="525" y="402" text-anchor="middle" fill="#f9a8d4" font-size="9">Observability</text>
  <text x="525" y="418" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">CloudWatch</text>
  <text x="525" y="434" text-anchor="middle" fill="#8e8e93" font-size="9">Alarms → SNS → Slack</text>

  <!-- GitHub Actions -->
  <rect x="180" y="380" width="130" height="60" rx="10" fill="#1c1c1e" stroke="#a3a3a3" stroke-width="1.5"/>
  <text x="245" y="402" text-anchor="middle" fill="#d4d4d4" font-size="9">CI/CD</text>
  <text x="245" y="418" text-anchor="middle" fill="#f5f5f7" font-size="11" font-weight="500">GitHub Actions</text>
  <text x="245" y="434" text-anchor="middle" fill="#8e8e93" font-size="9">Test → Synth → Deploy</text>

  <!-- CDK -->
  <rect x="180" y="460" width="130" height="40" rx="8" fill="#1c1c1e" stroke="#a3a3a3" stroke-width="1"/>
  <text x="245" y="484" text-anchor="middle" fill="#f5f5f7" font-size="10" font-weight="500">AWS CDK (TypeScript)</text>

  <!-- Arrows -->
  <!-- User → Frontend -->
  <line x1="130" y1="230" x2="178" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Frontend → API Gateway -->
  <line x1="300" y1="230" x2="348" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- API Gateway → Lambda -->
  <line x1="470" y1="230" x2="518" y2="230" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Lambda → Bedrock KB -->
  <line x1="640" y1="218" x2="698" y2="155" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Lambda → Bedrock LLM -->
  <line x1="640" y1="230" x2="698" y2="230" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- Lambda → DynamoDB -->
  <line x1="640" y1="245" x2="698" y2="305" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- S3 → Bedrock KB -->
  <line x1="770" y1="360" x2="770" y2="182" stroke="#4b5563" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-dim)"/>
  <!-- Lambda → CloudWatch -->
  <line x1="570" y1="262" x2="540" y2="378" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arrow)"/>
  <!-- GH Actions → CDK -->
  <line x1="245" y1="440" x2="245" y2="458" stroke="#4b5563" stroke-width="1" marker-end="url(#arrow-dim)"/>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6b7280"/>
    </marker>
    <marker id="arrow-dim" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4b5563"/>
    </marker>
  </defs>

  <!-- Legend -->
  <text x="30" y="500" fill="#8e8e93" font-size="9">Data flow →  |  Sync ┈┈→  |  Stacks: Data (blue/cyan) · AI (green/purple) · API (orange/yellow) · Observability (pink)</text>
</svg>
